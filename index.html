<!DOCTYPE html>
<html>
<head> 
<meta charset="utf-8"> 
<title>Jane's Channel</title> 
<style>
/* 全局设置，确保宽度计算正确 */
*,
*::before,
*::after {
  box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Arial, sans-serif;
	 margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden; /* 禁止滚动条 */
  }
	
  /* 顶部导航栏样式 */
 .navbar {
  display: flex;
  justify-content: space-between; /* LOGO 和菜单两端对齐 */
  align-items: center; /* 垂直居中 */
  background-color: #FFFFFF;
  padding: 20px 20px;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 1000;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  }

   /* 左侧 LOGO 样式（文字形式） */
  .navbar .logo {
margin-left: 10px;
    text-decoration: none;
    color: #000; /* 字体颜色 */
    font-size: 20px; /* 字体大小 */
    font-family: "Iowan Old Style", sans-serif; /* 字体类型 */
    font-weight: bold; /* 字体加粗 */
    text-transform: uppercase; /* 字母全部大写 */
    letter-spacing: 1px; /* 字母间距 */
  }

  /* 菜单样式 */
  .navbar .menu {
    display: flex;
    gap: 20px; /* 菜单项之间的间距 */
  }

.navbar .menu a {
  text-decoration: none;
  color: #000 !important; /* 强制字体颜色为黑色 */
  font-size: 14px !important; /* 强制字体大小 */
  font-family: "Iowan Old Style", sans-serif; /* 字体类型 */
  font-weight: regular; /* 字体加粗 */
  text-transform: capitalize; /* 首字母大写 */
  letter-spacing: 1px; /* 字母间距 */
  }

  .navbar .menu a:hover {
    color: #fff;
  }

  /* 内容样式 */
  .content {
    text-align: center;
    padding: 50px;
  }
	
/* 图片样式，让图片居中并充满页面 */
.content {
  position: relative; /* 让图片定位相对于父容器 */
  width: 100%;
  height: 100vh; /* 高度占满整个视口 */
}

.content img {
  position: absolute; /* 绝对定位图片 */
  top: 50%; /* 垂直方向居中 */
  left: 50%; /* 水平方向居中 */
  transform: translate(-50%, -50%); /* 使用 transform 实现居中 */
  width: 100vw; /* 宽度充满视口 */
  height: 100vh; /* 高度充满视口 */
  object-fit: cover; /* 图片按比例裁剪并填满视口 */
}
  /* 底部版权栏样式 */
  .footer {
    background-color: #FFFFFF;
    text-align: center;
    padding: 10px;
    position: fixed; /* 固定在底部 */
    bottom: 0; /* 距离底部为 0 */
    left: 0;
    width: 100%; /* 占满宽度 */
    font-size: 12px; /* 设置字体大小 */
    font-family: "Iowan Old Style", sans-serif; /* 字体类型 */
    font-weight: regular; /* 设置字体加粗 */
    color: #000000; /* 设置字体颜色 */
    box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1); /* 添加阴影效果，可选 */
  }
	
</style>
</head>
<body>
 
<!-- 顶部导航栏 -->
<div class="navbar">
  <!-- LOGO 文字 -->
  <a href="index.html" class="logo">Jane's Channel</a>
  
  <!-- 菜单 -->
  <div class="menu">
   <a href="campusprojects.html">Campus Projects</a>
    <a href="#Business Design">Work Projects</a>
    <a href="#Daily Record">Daily Record</a>
  </div>
</div>

<!-- 中间内容 -->
<div class="content">
 <!-- 插入大图 -->
  <img src="首页图.JPG" alt="A large image">
</div>

<!-- 底部版权 -->
<div class="footer">
  版权 © Jane.2025
</div>

</body>
</html>

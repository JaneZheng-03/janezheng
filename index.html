<!DOCTYPE html>
<html>
<head> 
<meta charset="utf-8"> 
<title>Jane's Channel</title> 
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
  }

  /* 顶部导航栏样式 */
  .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #FFFFFF;
    padding: 20px 20px;
    position: fixed; /* 固定在顶部 */
    top: 0;
    left: 0;
    width: 100%; /* 占满宽度 */
    z-index: 1000; /* 确保导航栏位于其他内容上方 */
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* 添加阴影效果，可选 */
flex-wrap: nowrap;
  }

   /* 左侧 LOGO 样式（文字形式） */
  .navbar .logo {
margin-left: 10px;
    text-decoration: none;
    color: #000; /* 字体颜色 */
    font-size: 20px; /* 字体大小 */
    font-family: "Iowan Old Style", sans-serif; /* 字体类型 */
    font-weight: bold; /* 字体加粗 */
    text-transform: uppercase; /* 字母全部大写 */
    letter-spacing: 1px; /* 字母间距 */
  }

  /* 右侧菜单样式 */
  .navbar .menu {
    display: flex;
    gap: 30px;
margin-right: 10px; /* 让菜单自动推到右侧 */
  }

.navbar .menu a {
  text-decoration: none;
  color: #000; /* 字体颜色 */
  font-size: 16px; /* 字体大小 */
  font-family: "Iowan Old Style", sans-serif; /* 字体类型 */
  font-weight: regular; /* 字体加粗 */
  text-transform: capitalize; /* 首字母大写 */
  letter-spacing: 1px; /* 字母间距 */
  }

  .navbar .menu a:hover {
    color: #fff;
  }

  /* 内容样式 */
  .content {
    text-align: center;
    padding: 50px;
  }
	
 /* 图片样式 */
  .content img {
    max-width: 100%; /* 图片宽度最大为屏幕宽度 */
    height: auto; /* 保持图片比例 */
    border-radius: 10px; /* 可选：为图片添加圆角 */
  }

  /* 底部版权栏样式 */
  .footer {
    background-color: #FFFFFF;
    text-align: center;
    padding: 10px;
    position: fixed; /* 固定在底部 */
    bottom: 0; /* 距离底部为 0 */
    left: 0;
    width: 100%; /* 占满宽度 */
    font-size: 12px; /* 设置字体大小 */
    font-family: "Iowan Old Style", sans-serif; /* 字体类型 */
    font-weight: regular; /* 设置字体加粗 */
    color: #000000; /* 设置字体颜色 */
    box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1); /* 添加阴影效果，可选 */
  }
	
</style>
</head>
<body>
 
<!-- 顶部导航栏 -->
<div class="navbar">
  <!-- LOGO 文字 -->
  <a href="index.html" class="logo">Jane's Channel</a>
  
  <!-- 菜单 -->
  <div class="menu">
   <a href="graficdesign.html">Grafic Design</a>
    <a href="#Service Design">Service Design</a>
    <a href="#Business Design">Business Design</a>
    <a href="#Daily Record">Daily Record</a>
  </div>
</div>

<!-- 中间内容 -->
<div class="content">
 <!-- 插入大图 -->
  <img src="首页图.JPG" alt="A large image">
</div>

<!-- 底部版权 -->
<div class="footer">
  版权 © Jane.2025
</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head> 
<meta charset="utf-8"> 
<title>Jane's Channel</title> 
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
  }

  /* 顶部导航栏样式 */
  .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #FFFFFF;
    padding: 10px 20px;
  }

  /* 左侧 logo 样式 */
  .navbar .logo img {
    height: 40px; /* 设置 logo 图片的高度 */
    width: auto;  /* 自动调整宽度，保持图片比例 */
  }

  /* 右侧菜单样式 */
  .navbar .menu {
    display: flex;
    gap: 20px;
  }

  .navbar .menu a {
    text-decoration: none;
    color: #000;
    font-size: 16px;
  }

  .navbar .menu a:hover {
    color: #fff;
  }

  /* 内容样式 */
  .content {
    text-align: center;
    padding: 50px;
  }

  .footer {
    background-color: #FFA500;
    text-align: center;
    padding: 10px;
    position: absolute;
    bottom: 0;
    width: 100%;
  }
</style>
</head>
<body>
 
<!-- 顶部导航栏 -->
<div class="navbar">
  <!-- logo 图片 -->
  <div class="logo">
    <img src="Group.png" alt="Logo">
  </div>
  
  <!-- 菜单 -->
  <div class="menu">
    <a href="#Grafic Design">HTML</a>
    <a href="#Service Design">CSS</a>
    <a href="#Business Design">JavaScript</a>
    <a href="#Daily Record">JavaScript</a>
  </div>
</div>

<!-- 中间内容 -->
<div class="content">
  <h1>主要的网页标题</h1>
  <p>内容在这里</p>
</div>

<!-- 底部版权 -->
<div class="footer">
  版权 © runoob.com
</div>

</body>
</html>

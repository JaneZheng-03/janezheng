<!DOCTYPE html>
<html>
<head> 
<meta charset="utf-8"> 
<title>Jane's Channel</title> 
<style>
/* 全局设置，确保宽度计算正确 */
*,
*::before,
*::after {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  width: 100%; /* 确保宽度一致 */
}

/* 顶部导航栏样式 */
.navbar {
  display: flex;
  justify-content: space-between; /* LOGO 和菜单两端对齐 */
  align-items: center; /* 垂直居中 */
  background-color: #FFFFFF;
  padding: 20px 20px;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 1000;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

/* 左侧 LOGO 样式（文字形式） */
.navbar .logo {
  margin-left: 10px;
  text-decoration: none;
  color: #000; /* 字体颜色 */
  font-size: 20px; /* 字体大小 */
  font-family: "Iowan Old Style", sans-serif; /* 字体类型 */
  font-weight: bold; /* 字体加粗 */
  text-transform: uppercase; /* 字母全部大写 */
  letter-spacing: 1px; /* 字母间距 */
}

/* 菜单样式 */
.navbar .menu {
  display: flex;
  gap: 20px; /* 菜单项之间的间距 */
}

.navbar .menu a {
  text-decoration: none;
  color: #000 !important; /* 强制字体颜色为黑色 */
  font-size: 14px !important; /* 强制字体大小 */
  font-family: "Iowan Old Style", sans-serif; /* 字体类型 */
  font-weight: regular; /* 字体加粗 */
  text-transform: capitalize; /* 首字母大写 */
  letter-spacing: 1px; /* 字母间距 */
}

.navbar .menu a:hover {
  color: #fff;
}

/* 页面标题 */
.title {
  margin-top: 120px;
  text-align: center;
  font-size: 32px;
  font-weight: bold;
  font-family: "Iowan Old Style", sans-serif; /* 字体类型 */
}

/* 分类菜单 */
.categories {
  text-align: center;
  margin: 20px 0;
  font-family: "Iowan Old Style", sans-serif; /* 字体类型 */
}

.categories a {
  text-decoration: none;
  color: gray;
  margin: 0 10px;
  font-size: 16px;
}

.categories a:hover {
  color: black;
}

/* 作品图网格布局 */
.projects {
  display: grid;
  grid-template-columns: repeat(3, 1fr); /* 每行 3 列 */
  gap: 20px;
  padding: 20px;
  max-width: 1200px;
  margin: 0 auto;
}

.project {
  position: relative; /* 为悬停效果设置相对定位 */
  overflow: hidden;
  border: 1px solid #ddd;
  transition: transform 0.3s, box-shadow 0.3s;
}

.project img {
  width: 100%;
  height: auto;
  display: block;
}

.project .info-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  background-color: white;
  color: black;
  text-align: center;
  padding: 10px 0;
  opacity: 0; /* 默认隐藏 */
  transform: translateY(100%); /* 初始位置在图片下方 */
  transition: transform 0.3s, opacity 0.3s;
  font-family: "Iowan Old Style", sans-serif; /* 字体类型 */
}

.project:hover .info-bar {
  transform: translateY(0); /* 鼠标悬停时上移到可见位置 */
  opacity: 1; /* 显示白色长条 */
}

.project-title {
  font-size: 16px;
  font-weight: bold;
  margin: 0;
}

.project-type {
  font-size: 12px;
  font-style: italic;
  margin: 0;
}

/* 底部版权栏样式 */
.footer {
  background-color: #FFFFFF;
  text-align: center;
  padding: 10px;
  position: fixed; /* 固定在底部 */
  bottom: 0; /* 距离底部为 0 */
  left: 0;
  width: 100%; /* 占满宽度 */
  font-size: 12px; /* 设置字体大小 */
  font-family: "Iowan Old Style", sans-serif; /* 字体类型 */
  font-weight: regular; /* 设置字体加粗 */
  color: #000000; /* 设置字体颜色 */
  box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1); /* 添加阴影效果，可选 */
}
</style>
</head>
<body>
 
<!-- 顶部导航栏 -->
<div class="navbar">
  <!-- LOGO 文字 -->
  <a href="index.html" class="logo">Jane's Channel</a>
  
  <!-- 菜单 -->
  <div class="menu">
    <a href="campusprojects.html">Campus Projects</a>
    <a href="#Service Design">Work Projects</a>
    <a href="#Daily Record">Daily Record</a>
  </div>
</div>

<!-- 中间内容 -->
<h1 class="title">Campus Projects 校园项目</h1>
<div class="categories">
  <a href="#">Service design 服务设计</a> | 
  <a href="#">Package design 包装设计</a> | 
  <a href="#">Book design 书籍设计</a> | 
  <a href="#">Cultural creative design 文创设计</a> | 
  <a href="#">LOGO design 商标设计</a> | 
  <a href="#">Illustration 插画</a>
</div>

<!-- 作品展示 -->
<div class="projects">
  <div class="project">
    <a href="greenschool.html">
      <img src="绿在区区封面.png" alt="GREEN@‘SCHOOL’绿在校园">
      <div class="info-bar">
        <div class="project-title">GREEN@‘SCHOOL’绿在校园</div>
        <div class="project-type">Service design 服务设计</div>
      </div>
    </a>
  </div>
  <!-- 添加更多项目 -->
</div>

<!-- 底部版权 -->
<div class="footer">
  版权 © Jane.2025
</div>

</body>
</html>

</body>
</html>

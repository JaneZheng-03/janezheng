<!DOCTYPE html>
<html>
<head> 
<meta charset="utf-8"> 
<title>Jane's Channel</title> 
<style>
/* 全局设置，确保宽度计算正确 */
*,
*::before,
*::after {
  box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Arial, sans-serif;
    width: 100%; /* 确保宽度一致 */
  }
	
  /* 顶部导航栏样式 */
 .navbar {
  display: flex;
  justify-content: space-between; /* LOGO 和菜单两端对齐 */
  align-items: center; /* 垂直居中 */
  background-color: #FFFFFF;
  padding: 20px 20px;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 1000;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  }

   /* 左侧 LOGO 样式（文字形式） */
  .navbar .logo {
margin-left: 10px;
    text-decoration: none;
    color: #000; /* 字体颜色 */
    font-size: 20px; /* 字体大小 */
    font-family: "Iowan Old Style", sans-serif; /* 字体类型 */
    font-weight: bold; /* 字体加粗 */
    text-transform: uppercase; /* 字母全部大写 */
    letter-spacing: 1px; /* 字母间距 */
  }

  /* 菜单样式 */
  .navbar .menu {
    display: flex;
    gap: 20px; /* 菜单项之间的间距 */
  }

.navbar .menu a {
  text-decoration: none;
  color: #000 !important; /* 强制字体颜色为黑色 */
  font-size: 14px !important; /* 强制字体大小 */
  font-family: "Iowan Old Style", sans-serif; /* 字体类型 */
  font-weight: regular; /* 字体加粗 */
  text-transform: capitalize; /* 首字母大写 */
  letter-spacing: 1px; /* 字母间距 */
  }

  .navbar .menu a:hover {
    color: #fff;
  }

  /* 内容样式 */
  .content {
    text-align: center;
    padding: 50px;
  }
	/* 页面标题样式 */
  .title {
    margin-top: 100px; /* 避免被导航栏遮挡 */
    text-align: center;
    font-size: 32px;
    font-weight: bold;
  }

  /* 小标题样式 */
  .categories {
    text-align: center;
    margin: 20px 0;
    color: gray;
    font-size: 14px;
    font-family: Arial, sans-serif;
  }

  .categories a {
    text-decoration: none;
    color: gray;
    margin: 0 10px;
    font-size: 14px;
  }

  .categories a:hover {
    text-decoration: underline;
  }

  /* 作品图网格布局 */
  .projects {
    display: grid;
    grid-template-columns: repeat(3, 1fr); /* 每行 3 列 */
    gap: 20px;
    padding: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .project {
    position: relative; /* 为悬停效果设置相对定位 */
    overflow: hidden;
    border: 1px solid #ddd;
    border-radius: 5px;
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .project img {
    width: 100%;
    height: auto;
    display: block;
  }

  .project .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5); /* 半透明黑色背景 */
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    opacity: 0; /* 默认隐藏 */
    transition: opacity 0.3s;
  }

  .project:hover .overlay {
    opacity: 1; /* 鼠标悬停时显示 */
  }

  .project-title {
    font-size: 16px;
    font-weight: bold;
    margin: 5px 0;
  }

  .project-type {
    font-size: 12px;
    font-style: italic;
  }

  .project:hover {
    transform: translateY(-5px);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  }

  /* 底部版权栏样式 */
  .footer {
    background-color: #FFFFFF;
    text-align: center;
    padding: 10px;
    position: fixed; /* 固定在底部 */
    bottom: 0; /* 距离底部为 0 */
    left: 0;
    width: 100%; /* 占满宽度 */
    font-size: 12px; /* 设置字体大小 */
    font-family: "Iowan Old Style", sans-serif; /* 字体类型 */
    font-weight: regular; /* 设置字体加粗 */
    color: #000000; /* 设置字体颜色 */
    box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1); /* 添加阴影效果，可选 */
  }
	
</style>
</head>
<body>
 
<!-- 顶部导航栏 -->
<div class="navbar">
  <!-- LOGO 文字 -->
  <a href="index.html" class="logo">Jane's Channel</a>
  
  <!-- 菜单 -->
  <div class="menu">
    <a href="#Graficdesign.html">Grafic Design</a>
    <a href="#Service Design">Service Design</a>
    <a href="#Business Design">Business Design</a>
    <a href="#Daily Record">Daily Record</a>
  </div>
</div>

<!-- 中间内容 -->
<!-- 页面标题 -->
<h1 class="title">Grafic Design</h1>

<!-- 小标题 -->
<div class="categories">
  <a href="#">包装设计</a> | 
  <a href="#">海报设计</a> | 
  <a href="#">Logo设计</a> | 
  <a href="#">品牌设计</a> | 
  <a href="#">插画设计</a>
</div>

<!-- 作品展示 -->
<div class="projects">
  <!-- 每个项目 -->
  <div class="project">
    <img src="https://via.placeholder.com/400x300" alt="Project 1">
    <div class="overlay">
      <div class="project-title">Project 1</div>
      <div class="project-type">Logo Design</div>
    </div>
  </div>
  <div class="project">
    <img src="https://via.placeholder.com/400x300" alt="Project 2">
    <div class="overlay">
      <div class="project-title">Project 2</div>
      <div class="project-type">Poster Design</div>
    </div>
  </div>
  <div class="project">
    <img src="https://via.placeholder.com/400x300" alt="Project 3">
    <div class="overlay">
      <div class="project-title">Project 3</div>
      <div class="project-type">Packaging Design</div>
    </div>
  </div>
  <!-- 添加更多项目 -->
</div>

<!-- 底部版权 -->
<div class="footer">
  版权 © Jane.2025
</div>

</body>
</html>
